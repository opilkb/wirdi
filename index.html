<style>
:root{--bg:#F7F6EC;--card:#FFFFFF;--tx:#2F3B2A;--mut:#7A8672;--acc:#93C572;--acc2:#6FA64F;--sage:#DCE6D0;--bd:#E4E8D8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E2216;--card:#2A3020;--tx:#EEF2E4;--mut:#A3AD94;--acc:#A5D17F;--acc2:#8CBE66;--sage:#38402B;--bd:#3C4430;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1E2216;--card:#2A3020;--tx:#EEF2E4;--mut:#A3AD94;--acc:#A5D17F;--acc2:#8CBE66;--sage:#38402B;--bd:#3C4430;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,"Geeza Pro","Segoe UI",Tahoma,sans-serif;font-size:18px;line-height:1.6;padding-bottom:84px}
main{max-width:620px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:4px 0}h2{font-size:20px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:15px}
.bar{height:12px;background:var(--sage);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:9px;transition:width .3s}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
.wi{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;margin:8px 0}
.wi.d{background:var(--sage)}.wi.d .nm{text-decoration:line-through;opacity:.7}
.ck{width:38px;height:38px;border-radius:50%;border:2px solid var(--acc2);background:transparent;color:#fff;font-size:22px;flex:none;cursor:pointer}
.d .ck{background:var(--acc2)}
button{font-family:inherit;font-size:16px;color:var(--tx)}
.b{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:8px 14px;cursor:pointer}
.b.p{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.ct{display:flex;align-items:center;gap:6px}.ct button{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:22px;cursor:pointer}
.ct b{min-width:70px;text-align:center;font-size:16px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;font-size:13px;color:var(--mut);cursor:pointer;padding:4px 0}
nav button span{display:block;font-size:22px}nav button.on{color:var(--acc2);font-weight:700}
input,select,textarea{font-family:inherit;font-size:17px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:15px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cell{border-radius:12px;padding:6px 0;background:color-mix(in srgb,var(--acc2) calc(var(--p,0)*1%),var(--card));border:1px solid var(--bd);cursor:pointer;font-size:15px;min-height:46px}
.cell.cur{outline:3px solid var(--acc2)}.cell small{display:block;font-size:11px;color:var(--mut)}
.hd{font-size:12px;color:var(--mut);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:4px 12px;cursor:pointer}.chips button.on{background:var(--acc2);color:#fff}
#md{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#md[hidden]{display:none}#md>div{background:var(--card);width:100%;max-width:620px;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--acc2);color:#fff;padding:10px 18px;border-radius:20px;z-index:20}
#toast[hidden]{display:none}
.bx{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ob{width:56px;border:0;background:none;text-align:center;padding:0;cursor:pointer}.ob span{display:flex;width:42px;height:42px;margin:auto;border-radius:50%;border:2px solid var(--acc2);align-items:center;justify-content:center;color:#fff;font-size:22px}.ob.on span{background:var(--acc2)}.ob small{display:block;font-size:12px;color:var(--mut);line-height:1.3;margin-top:2px}
body{background-color:var(--bg);background-image:linear-gradient(180deg,var(--sage),var(--bg) 280px);background-repeat:no-repeat}
.card{border:0;border-radius:24px;box-shadow:0 4px 14px rgba(110,150,80,.14)}
.hero{background:linear-gradient(135deg,#C2E29E,#7DB35A);color:#1F3016}.hero .mut{color:#34502A}.hero .bar{background:#ffffff70}.hero .bar i{background:#fff}.hero [style*="font-size:28px"]{color:#fff!important}
.wi{border:0;border-right:7px solid var(--acc);border-radius:22px;padding:14px;box-shadow:0 3px 10px rgba(110,150,80,.14)}
.wi.d{background:var(--sage);border-right-color:var(--acc2)}
.ck{width:46px;height:46px;border-width:3px;background:var(--bg);box-shadow:0 2px 6px rgba(110,150,80,.25)}.d .ck{background:var(--acc2)}
.ob{width:64px}.ob span{width:50px;height:50px;border-width:3px;background:var(--bg);box-shadow:0 2px 6px rgba(110,150,80,.25)}.ob.on span{background:var(--acc2);box-shadow:0 4px 10px rgba(110,150,80,.45)}
.b{border-radius:16px}.b.p{box-shadow:0 3px 8px rgba(110,150,80,.35)}
nav{border:0;border-radius:26px 26px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.1)}nav button.on span{background:var(--sage);border-radius:14px;margin:0 12px 2px}
.cell{border:0;border-radius:14px}
.ed{padding:6px 10px;font-size:15px;flex:none}html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,.ob,.cell,.wi{touch-action:manipulation;-webkit-user-select:none;user-select:none}body{touch-action:manipulation}
@media print{nav,.noprint,.ct button,.ck{display:none!important}body{background:#fff;color:#000}.card,.wi{break-inside:avoid}}
</style>

<script>
var $=function(s){return document.querySelector(s)};
var DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
var MN=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
var uid=function(){return Math.random().toString(36).slice(2,9)};
var S=null;
function defs(){var f=dk(new Date(Date.now()-0));function w(n,t,tg,u){return{id:uid(),name:n,type:t,target:tg||0,unit:u||'',rep:'daily',days:[],time:'',from:'2000-01-01'}}
return{w:[w('أذكار الصباح','c'),w('أذكار المساء','c'),w('قراءة القرآن','n',5,'صفحة'),w('الاستغفار','n',100,'مرة'),w('التسبيح','n',100,'مرة'),w('الصلاة على النبي ﷺ','n',100,'مرة'),w('أذكار النوم','c')],log:{},notes:{},set:{theme:'auto',ws:6,ds:0}}}
function load(){try{var r=localStorage.getItem('wirdi');if(r)S=JSON.parse(r)}catch(e){}if(!S||!S.w)S=defs();mig()}
function mig(){if(S.v2)return;S.w.forEach(function(w){if(w.type==='n')w.target=0});S.v2=1;S.t=Date.now()}
var LSok=true,DBR=null,pt;
function save(){S.t=Date.now();try{localStorage.setItem('wirdi',JSON.stringify(S));if(localStorage.getItem('wirdi')===null)LSok=false}catch(e){LSok=false}clearTimeout(pt);pt=setTimeout(pushDb,700)}
function pushDb(){if(DBR)try{DBR.set({json:JSON.stringify(S),t:S.t}).catch(function(){DBR=null})}catch(e){}}
function dbInit(){try{if(!window.claude||!window.claude.use)return;Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){var db=r[0],u=r[1];if(!db||!u)return;return u.id().then(function(id){if(!id)return;var ref=db.collection('data/users/'+id).doc('wirdi');return ref.get().then(function(sn){DBR=ref;if(sn.exists){var d=sn.data(),rs=JSON.parse(d.json);if((d.t||0)>(S.t||0)){S=rs;mig();try{localStorage.setItem('wirdi',JSON.stringify(S))}catch(e){}theme();pushDb()}else pushDb()}else pushDb();render()})})}).catch(function(){})}catch(e){}}
function dk(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function pk(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2],12)}
function addd(k,n){var d=pk(k);d.setDate(d.getDate()+n);return dk(d)}
function todayK(){return dk(new Date(Date.now()-S.set.ds*3600000))}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sched(w,k){if(k<w.from)return false;if(w.rep==='daily')return true;return w.days.indexOf(pk(k).getDay())>-1}
function val(w,k){return (S.log[k]||{})[w.id]||0}
function pc(m){var c=0;while(m){c+=m&1;m>>=1}return c}function dh(w){return w.dhikr?'<div class="mut" style="font-size:16px">'+esc(w.dhikr)+'</div>':''}function isDone(w,k){if(w.type==='b')return pc(val(w,k))>=w.count;return w.type==='n'&&w.target>0?val(w,k)>=w.target:val(w,k)>=1}
function pct(k){var l=S.w.filter(function(w){return sched(w,k)});if(!l.length)return null;return Math.round(100*l.filter(function(w){return isDone(w,k)}).length/l.length)}
function setv(w,k,v){if(!S.log[k])S.log[k]={};S.log[k][w.id]=Math.max(0,v);save()}
function hij(k){try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(pk(k))}catch(e){return ''}}
